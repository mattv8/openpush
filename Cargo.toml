[workspace]
members = ["crates/*", "services/*"]
exclude = ["apps/desktop/src-tauri", "vendor/phonenumber"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
axum = "=0.8.6"
schemars = "=1.0.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "migrate", "macros"] }
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "=0.1.41"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
