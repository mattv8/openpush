[package]
name = "openpush-crypto"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libsodium-rs = "=0.2.5"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
