[package]
name = "openpush-mobile-bindings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "MPL-2.0"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
openpush-client-core = { path = "../client-core", version = "0.1.0" }
openpush-crypto = { path = "../crypto", version = "0.1.0" }
serde_json.workspace = true
thiserror.workspace = true
uniffi = "=0.32.2"
uuid.workspace = true
zeroize = "=1.9.0"

[features]
cli = ["uniffi/cli"]

[dev-dependencies]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]
