[package]
name = "peppy-mobile-bindings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "MPL-2.0"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
peppy-client-core = { path = "../client-core", version = "0.1.0" }
peppy-crypto = { path = "../crypto", version = "0.1.0" }
peppy-protocol = { path = "../protocol", version = "0.1.0" }
serde_json.workspace = true
thiserror.workspace = true
uniffi = "=0.32.2"
base64 = "=0.22.1"
libsodium-rs = "=0.2.5"
uuid.workspace = true
zeroize = "=1.9.0"

[features]
cli = ["uniffi/cli"]

[dev-dependencies]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]
