[package]
name = "peppy-client-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
peppy-crypto = { path = "../crypto", version = "0.1.0" }
peppy-domain = { path = "../domain", version = "0.1.0" }
peppy-protocol = { path = "../protocol", version = "0.1.0" }
# Matches SQLx 0.8's libsqlite3-sys 0.30 links dependency in this workspace.
rusqlite = { version = "=0.32.1", features = ["bundled-sqlcipher"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
thiserror.workspace = true
uuid.workspace = true
zeroize = "=1.9.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
phonenumber = { path = "../../vendor/phonenumber", version = "=0.3.10" }

[target.'cfg(any(target_os = "android", target_os = "windows"))'.dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "=3.23.0"
