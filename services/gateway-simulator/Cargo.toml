[package]
name = "openpush-gateway-simulator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[dependencies]
openpush-client-core = { path = "../../crates/client-core", version = "0.1.0" }
openpush-crypto = { path = "../../crates/crypto", version = "0.1.0" }
openpush-domain = { path = "../../crates/domain", version = "0.1.0" }
openpush-protocol = { path = "../../crates/protocol", version = "0.1.0" }
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
futures-util = "=0.3.31"
hex = "=0.4.3"
rand = "=0.8.8"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
url = "=2.5.7"
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
tokio-tungstenite = "=0.28.0"
tokio-util = { version = "=0.7.17", features = ["io"] }

[dev-dependencies]
axum.workspace = true
openpush-server = { path = "../server", version = "0.1.0" }
sqlx = { workspace = true, features = ["uuid"] }
tempfile = "=3.23.0"
