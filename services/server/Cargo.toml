[package]
name = "peppy-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
futures-util = "=0.3.31"
peppy-protocol = { path = "../../crates/protocol", version = "0.1.0" }
peppy-domain = { path = "../../crates/domain", version = "0.1.0" }
hex = "=0.4.3"
# Unused since health signing moved to the aws-sigv4 adapter; removal needs a root Cargo.lock refresh.
hmac = "=0.12.1"
ipnet = "=2.11.0"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sqlx = { workspace = true, features = ["uuid"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
tokio-util = { version = "=0.7.17", features = ["io"] }
aws-credential-types = "=1.2.8"
aws-sigv4 = "=1.3.6"
tracing.workspace = true
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["formatting", "macros"] }
url = "=2.5.7"
uuid.workspace = true

[dev-dependencies]
peppy-client-core = { path = "../../crates/client-core", version = "0.1.0" }
peppy-crypto = { path = "../../crates/crypto", version = "0.1.0" }
tempfile = "=3.23.0"
http-body-util = "=0.1.3"
tower = "=0.5.2"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = "=0.28.0"
