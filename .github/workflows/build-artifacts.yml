name: Development artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  android-development-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - run: rustup target add aarch64-linux-android
      - run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libssl-dev
      - name: Install Android NDK
        run: |
          set +e
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          exit "$sdkmanager_status"
      - name: Build APK and unsigned release bundles
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          infra/compose/verify-android-native.sh
          cd apps/android
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-development-artifacts
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  desktop-development-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            bundles: appimage,deb,rpm
            posix_bundles: appimage deb rpm
            path: dist/desktop-linux-bundles.tar.gz
          - os: macos-26
            name: macos
            bundles: app,dmg
            posix_bundles: macos
            path: |
              dist/desktop-macos-bundles.tar.gz
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-2025
            name: windows
            bundles: nsis,msi
            path: |
              apps/desktop/src-tauri/target/release/bundle/nsis/**
              apps/desktop/src-tauri/target/release/bundle/msi/**
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - run: corepack enable && pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libsqlite3-dev libssl-dev libsodium-dev libsecret-1-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev rpm
      - if: runner.os == 'Windows'
        name: Select native Windows Perl
        shell: pwsh
        run: |
          $perl = (Get-Command perl.exe -CommandType Application -ErrorAction Stop).Source
          if ($perl -match '(?i)\\(?:Git\\usr|msys64\\usr)\\bin\\perl\.exe$') {
            $perl = 'C:\Strawberry\perl\bin\perl.exe'
            if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
              throw "Native Strawberry Perl was not found at $perl"
            }
          }
          $perl = (Resolve-Path -LiteralPath $perl).ProviderPath
          & $perl -MIPC::Cmd -e '1'
          if ($LASTEXITCODE -ne 0) {
            throw "Native Perl at $perl cannot load IPC::Cmd"
          }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Tauri bundles
        shell: bash
        run: pnpm --dir apps/desktop exec tauri build --bundles '${{ matrix.bundles }}' -- --locked
      - if: runner.os != 'Windows'
        name: Preserve POSIX bundle permissions
        shell: bash
        run: |
          mkdir -p dist
          tar -C apps/desktop/src-tauri/target/release/bundle \
            -czf "dist/desktop-${{ matrix.name }}-bundles.tar.gz" ${{ matrix.posix_bundles }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.name }}-development-artifacts
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios-development-artifacts:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - name: Build simulator app and unsigned device archive
        run: infra/build/build-ios-artifacts.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-development-artifacts
          path: dist/ios/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
