name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      integration: ${{ steps.scope.outputs.integration }}
      desktop: ${{ steps.scope.outputs.desktop }}
      android: ${{ steps.scope.outputs.android }}
      swift_bindings: ${{ steps.scope.outputs.swift_bindings }}
      container_image: ${{ steps.scope.outputs.container_image }}
      development_artifacts: ${{ steps.scope.outputs.development_artifacts }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-paths-filter.yml
          predicate-quantifier: some-with-excludes
      - id: scope
        shell: bash
        env:
          FILTER_FORCE_FULL: ${{ github.event_name != 'pull_request' }}
          FILTER_RUST: ${{ steps.filter.outputs.rust }}
          FILTER_DESKTOP: ${{ steps.filter.outputs.desktop }}
          FILTER_ANDROID: ${{ steps.filter.outputs.android }}
          FILTER_IOS: ${{ steps.filter.outputs.ios }}
          FILTER_SERVER: ${{ steps.filter.outputs.server }}
          FILTER_BUILD: ${{ steps.filter.outputs.build }}
          FILTER_CI: ${{ steps.filter.outputs.ci }}
          FILTER_UNCLASSIFIED: ${{ steps.filter.outputs.unclassified }}
        run: bash .github/scripts/ci-scope.sh

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      base_version: ${{ steps.compute.outputs.base_version }}
      channel: ${{ steps.compute.outputs.channel }}
      bump: ${{ steps.compute.outputs.bump }}
      last_stable: ${{ steps.compute.outputs.last_stable }}
      commits_since: ${{ steps.compute.outputs.commits_since }}
      head_released: ${{ steps.compute.outputs.head_released }}
      android_version_code: ${{ steps.compute.outputs.android_version_code }}
      wix_version: ${{ steps.compute.outputs.wix_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: infra/release/install-git-cliff.sh "$RUNNER_TEMP/bin"
      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - id: compute
        env:
          CHANNEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prerelease' || 'dev' }}
        run: infra/release/compute-version.sh --channel "$CHANNEL" | tee -a "$GITHUB_OUTPUT"

  release-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: shellcheck infra/release/*.sh
      - run: infra/release/install-git-cliff.sh "$RUNNER_TEMP/bin"
      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: infra/release/test-compute-version.sh
      - run: infra/release/test-release-scripts.sh

  source-audit:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - run: |
          scan=$(mktemp -d)
          trap 'rm -rf "$scan"' EXIT
          git ls-files -co --exclude-standard -z | tar --null -T - -cf - | tar -xf - -C "$scan"
          docker run --rm -v "$scan:/repo:ro" -v "$PWD/.gitleaks.toml:/gitleaks.toml:ro" -w /repo zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source . --no-git --redact --exit-code 1 --config /gitleaks.toml

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libpq-dev libsqlite3-dev libssl-dev libsodium-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --lib --exclude peppy-push-relay --locked
      - run: cargo run --locked -p peppy-protocol --bin generate-contracts -- --check
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check licenses bans sources
      - run: cargo deny check advisories
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python3 infra/audit/check-vendored.py

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @peppy/desktop build
      - run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libpq-dev libsqlite3-dev libssl-dev libsodium-dev libsecret-1-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      - run: |
          source infra/compose/test-env.sh
          cleanup() {
            status=$?
            peppy_test_compose logs --no-color || true
            peppy_test_infra_down || true
            exit "$status"
          }
          trap cleanup EXIT
          peppy_test_infra_up
          cargo test --workspace --locked
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --ignored

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # Uncached Windows Tauri check + test builds take ~30 minutes on hosted runners.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 60 || 30 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @peppy/desktop-ui test
      - run: pnpm --filter @peppy/desktop test
      - run: pnpm --filter @peppy/desktop build
      - if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tests/dev/windows-desktop.Tests.ps1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libsqlite3-dev libssl-dev libsodium-dev libsecret-1-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml --config deny.toml check licenses bans sources advisories

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libssl-dev
      - run: |
          set +e
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          exit "$sdkmanager_status"
      - run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          infra/compose/verify-android-native.sh
          cd apps/android && ./gradlew :jvm-smoke:run :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

  development-tools:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install --yes just shellcheck
      - run: python3 -m unittest discover -s tests/dev -p 'test_*.py'
      - run: bash -n infra/dev/dev.sh infra/dev/container-run.sh infra/dev/android.sh infra/dev/android-container-run.sh infra/dev/desktop.sh infra/compose/verify-android-native.sh && shellcheck infra/dev/dev.sh infra/dev/container-run.sh infra/dev/android.sh infra/dev/android-container-run.sh infra/dev/desktop.sh infra/compose/verify-android-native.sh
      - run: shellcheck .github/scripts/*.sh
      - run: bash .github/scripts/test-ci-scripts.sh
      - run: just --list

  swift-bindings:
    needs: changes
    if: needs.changes.outputs.swift_bindings == 'true'
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - run: |
          cargo build -p peppy-mobile-bindings --locked
          cargo run --locked -p peppy-mobile-bindings --features cli --bin uniffi-bindgen -- generate --library target/debug/libpeppy_mobile_bindings.dylib --language swift --out-dir apps/ios/Generated
          cargo run --locked -p peppy-mobile-bindings --features cli --bin uniffi-bindgen -- generate --library target/debug/libpeppy_mobile_bindings.dylib --language kotlin --out-dir apps/android/app/src/main/java
          git diff --exit-code -- apps/ios/Generated apps/android/app/src/main/java/uniffi
          (cd apps/ios && DYLD_LIBRARY_PATH="$PWD/../../target/debug" swift test --no-parallel)
          (cd apps/ios && DYLD_LIBRARY_PATH="$PWD/../../target/debug" swift run PeppyMobileSmoke)

  development-artifacts:
    uses: ./.github/workflows/build-artifacts.yml
    needs: [changes, version]
    if: needs.changes.outputs.development_artifacts == 'true'
    with:
      version: ${{ needs.version.outputs.version }}
      android_version_code: ${{ needs.version.outputs.android_version_code }}
      wix_version: ${{ needs.version.outputs.wix_version }}

  container-image:
    uses: ./.github/workflows/build-container.yml
    needs: [changes, version]
    if: needs.changes.outputs.container_image == 'true'
    with:
      version: ${{ needs.version.outputs.version }}
      upload: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  gate:
    if: always()
    needs: [changes, source-audit, version, release-tooling, development-tools, rust, integration, desktop, android, swift-bindings, container-image, development-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Evaluate CI gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_REQUIRED: 'true'
          SOURCE_AUDIT_RESULT: ${{ needs.source-audit.result }}
          SOURCE_AUDIT_REQUIRED: 'true'
          VERSION_RESULT: ${{ needs.version.result }}
          VERSION_REQUIRED: 'true'
          RELEASE_TOOLING_RESULT: ${{ needs.release-tooling.result }}
          RELEASE_TOOLING_REQUIRED: 'true'
          DEVELOPMENT_TOOLS_RESULT: ${{ needs.development-tools.result }}
          DEVELOPMENT_TOOLS_REQUIRED: 'true'
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          INTEGRATION_REQUIRED: ${{ needs.changes.outputs.integration }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_REQUIRED: ${{ needs.changes.outputs.android }}
          SWIFT_BINDINGS_RESULT: ${{ needs.swift-bindings.result }}
          SWIFT_BINDINGS_REQUIRED: ${{ needs.changes.outputs.swift_bindings }}
          CONTAINER_IMAGE_RESULT: ${{ needs.container-image.result }}
          CONTAINER_IMAGE_REQUIRED: ${{ needs.changes.outputs.container_image }}
          DEVELOPMENT_ARTIFACTS_RESULT: ${{ needs.development-artifacts.result }}
          DEVELOPMENT_ARTIFACTS_REQUIRED: ${{ needs.changes.outputs.development_artifacts }}
        run: bash .github/scripts/ci-gate.sh

  publish-prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success' && needs.version.outputs.head_released != 'true'
    needs: [version, gate]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: prerelease
      sha: ${{ github.sha }}
