name: openpush

services:
  postgres:
    image: postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [private]

  seaweedfs:
    image: chrislusf/seaweedfs:4.09@sha256:353c69c8ddd7e13c85c1290dca9d1690bf3d066237b7ede7920b8fd2864858e7
    command: >-
      server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.port=9333 -volume.port=8080
      -filer -filer.port=8888 -ip=seaweedfs -ip.bind=0.0.0.0
    environment:
      WEED_S3_CONFIG_FILE: /etc/seaweedfs/s3.json
    configs:
      - source: seaweed-s3-config
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweed-volume-data:/data
      - seaweed-filer-data:/root/.seaweedfs
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -Eq 'HTTP/.* (401|403)'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [private]

  migrate:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    command: ["migrate"]
    environment: &server-environment
      OPENPUSH_ENV: ${OPENPUSH_ENV:-development}
      RUNNING_IN_CONTAINER: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
      S3_INTERNAL_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      S3_BUCKET: ${S3_BUCKET:-openpush-private}
      OPENPUSH_REPLAY_RETENTION_DAYS: ${OPENPUSH_REPLAY_RETENTION_DAYS:-30}
      VAULT_ATTACHMENT_QUOTA_BYTES: ${VAULT_ATTACHMENT_QUOTA_BYTES:-536870912}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set in .env}
      PUBLIC_ATTACHMENT_URL: ${PUBLIC_ATTACHMENT_URL:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      <<: *server-environment
      BIND_ADDR: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_HOST_PORT:-7000}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/openpush-server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [private, edge]

networks:
  private:
    internal: true
  edge:

volumes:
  postgres-data:
  seaweed-volume-data:
  seaweed-filer-data:

configs:
  seaweed-s3-config:
    content: |
      {"identities":[{"name":"openpush-private","credentials":[{"accessKey":"${S3_ACCESS_KEY}","secretKey":"${S3_SECRET_KEY}"}],"actions":["Read","Write","List","Tagging","Admin"]}]}
