[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
commit_parsers = [
  { field = 'breaking', pattern = 'true', group = 'Breaking changes' },
  { message = '^feat', group = 'Features' },
  { message = '^fix', group = 'Fixes' },
  { message = '^perf', group = 'Performance' },
  { message = '.*', group = 'Other' },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = '0.1.0'

[changelog]
header = ''
body = '''
{%- set all_commits = commits -%}
{%- for group in ["Breaking changes", "Features", "Fixes", "Performance", "Other"] -%}
{%- set group_commits = all_commits | filter(attribute="group", value=group) -%}
{%- if group_commits | length > 0 %}
### {{ group }}
{% for commit in group_commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endif -%}
{%- endfor -%}
'''
footer = ''
